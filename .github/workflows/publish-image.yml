---
name: publish-image
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read

# Do not cancel in-progress builds: image publishing produces real artifacts,
# and serializing runs prevents tag updates from publishing out of order.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: dlresende/dotfiles
  # Mirrors the matrix suffixes: the merge loop needs the same list to find
  # the per-arch images, and GitHub matrices cannot feed a later job.
  ARCH_SUFFIXES: amd64 arm64

jobs:
  # One native build per architecture: emulating arm64 under QEMU turns the
  # half-hour install into hours, while the arm runner is free on public repos.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The image's install runs rootlesskit's smoke test, which needs to
          # create a user namespace that dockerd's default seccomp profile
          # denies inside the build - consumed by the Dockerfile's
          # --security=insecure RUN.
          driver: docker-container
          buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=sha,format=short,prefix=

      # Caching is omitted: changes to dotfiles invalidate the layer, GHA cache is
      # limited to 10GB, and non-reproducible upstream packages could produce stale images.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          allow: security.insecure
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # head_ref holds source branch on pull_request (where ref_name is merge ref), while ref_name applies on push
          build-args: |
            BRANCH=${{ github.head_ref || github.ref_name }}
          provenance: false
          sbom: false

  # A manifest list is one registry operation over every per-arch image, so it
  # waits here for both builds rather than happening inside either.
  merge:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=sha,format=short,prefix=

      - name: Create manifest list and push
        run: |
          for tag in $tags
          do
            image_names=()
            for suffix in $ARCH_SUFFIXES
            do
              image_names+=("${IMAGE}:${tag##*:}-${suffix}")
            done
            docker buildx imagetools create -t "$tag" "${image_names[@]}"
          done
        env:
          tags: ${{ steps.meta.outputs.tags }}

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:latest"
