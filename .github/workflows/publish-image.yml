---
name: publish-image
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read

# Do not cancel in-progress builds: image publishing produces real artifacts,
# and serializing runs prevents tag updates from publishing out of order.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: dlresende/dotfiles
  # Mirrors the matrix suffixes: the merge loop needs the same list to find
  # the per-arch images, and GitHub matrices cannot feed a later job.
  ARCH_SUFFIXES: amd64 arm64

jobs:
  # One native build per architecture: emulating arm64 under QEMU turns the
  # half-hour install into hours, while the arm runner is free on public repos.
  build:
    # Fork builds lack Docker Hub credentials and cannot publish images.
    if: github.repository == 'dlresende/dotfiles'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The image's install runs rootlesskit's smoke test, which needs to
          # create a user namespace that dockerd's default seccomp profile
          # denies inside the build - consumed by the Dockerfile's
          # --security=insecure RUN.
          driver: docker-container
          buildkitd-flags: --allow-insecure-entitlement security.insecure

      # Only the immutable per-arch candidate is published here: latest and
      # date tags move in merge, once every architecture has built, so a
      # failed leg never leaves a mutable tag half-updated. merge only ever
      # consumes the <sha>-<suffix> tags below.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-${{ matrix.suffix }}
          tags: |
            type=sha,format=short,prefix=

      # Caching is omitted: changes to dotfiles invalidate the layer, GHA cache is
      # limited to 10GB, and non-reproducible upstream packages could produce stale images.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          allow: security.insecure
          # Export a docker-archive tarball instead of load/push: the image is
          # ~24GB uncompressed against a 14GB-guaranteed-free runner disk, so
          # loading it into the host daemon would not fit. The tarball stays
          # compressed (~5GB) and both trivy and skopeo read it directly.
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # head_ref holds source branch on pull_request (where ref_name is merge ref), while ref_name applies on push
          build-args: |
            BRANCH=${{ github.head_ref || github.ref_name }}
          provenance: false
          sbom: false

      # The builder is only torn down in post-job cleanup; drop its cache
      # before the scan pulls layer blobs, to stay under the disk ceiling.
      - name: Prune BuildKit cache
        run: |
          df -h /
          docker buildx prune --all --force
          df -h /

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.2

      # Fail the build on fixed CRITICAL findings across OS and library
      # packages; unfixed upstream CVEs are listed but do not block, since
      # Homebrew bottles cannot be patched from this repo. Vuln-only scanning
      # keeps trivy off the certs bundled in the ~24GB image, and 30m covers
      # the vuln-DB download plus cataloguing the unpacked layer on 4 vCPUs.
      - name: Scan Docker image
        run: |
          trivy image --input "${{ runner.temp }}/image.tar" \
            --scanners vuln \
            --severity CRITICAL \
            --pkg-types os,library \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 30m \
            --format table

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: env.PUSH == 'true'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --dest-authfile "${HOME}/.docker/config.json" \
              "docker-archive:${{ runner.temp }}/image.tar:$tag" "docker://$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  # A manifest list is one registry operation over every per-arch image, so it
  # waits here for both builds rather than happening inside either.
  merge:
    # Forks lack credentials and manifest lists only publish on main.
    if: github.repository == 'dlresende/dotfiles' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=sha,format=short,prefix=

      - name: Create manifest list and push
        # Use immutable commit SHA as source to prevent midnight date rollover failures
        run: |
          tag_args=()
          for tag in $tags
          do
            tag_args+=(-t "$tag")
          done
          image_sources=()
          for suffix in $ARCH_SUFFIXES
          do
            image_sources+=("${IMAGE}:${GITHUB_SHA::7}-${suffix}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${image_sources[@]}"
        env:
          tags: ${{ steps.meta.outputs.tags }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:latest"
