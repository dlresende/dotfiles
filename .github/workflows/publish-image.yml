---
name: publish-image
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read

# Do not cancel in-progress builds: image publishing produces real artifacts,
# and serializing runs prevents tag updates from publishing out of order.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: dlresende/dotfiles

jobs:
  publish-image:
    if: github.repository == 'dlresende/dotfiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=sha,format=short,prefix=

      # Caching is omitted: changes to dotfiles invalidate the layer, GHA cache is
      # limited to 10GB, and non-reproducible upstream packages could produce stale images.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # head_ref holds source branch on pull_request (where ref_name is merge ref), while ref_name applies on push
          build-args: |
            BRANCH=${{ github.head_ref || github.ref_name }}
          provenance: false
          sbom: false
