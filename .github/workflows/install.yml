---
name: install
on:
  push:
    branches: [ macOS, linux ]
  pull_request:
    branches: [ macOS, linux ]
  workflow_dispatch:
permissions:
  contents: read

# A newer push supersedes an in-flight run rather than queueing another
# full install alongside it.
concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    # Without this a hang costs the 6h job ceiling instead of failing fast.
    timeout-minutes: 45
    env:
      # `mas` needs an App Store sign-in the runner does not have, so Xcode
      # would block until the job is killed. This is a space-separated list
      # of app names/ids to skip, not a boolean - `1` was a silent no-op.
      HOMEBREW_BUNDLE_MAS_SKIP: 497799835
    steps:
      - uses: actions/checkout@v4
        with:
          # The install script executes third-party code (the Homebrew
          # installer, rbenv-doctor, tpm plugins), and HOME is set to the
          # workspace below, so don't leave a token behind in .git/config
          persist-credentials: false
      - name: Configure Flatpak polkit rules for headless CI
        if: runner.os == 'Linux'
        run: |
          if [ -d /etc/polkit-1/rules.d ]; then
            sudo tee /etc/polkit-1/rules.d/49-flatpak.rules > /dev/null << 'EOF'
          polkit.addRule(function(action, subject) {
              if (action.id.indexOf("org.freedesktop.Flatpak") === 0 ||
                  action.id.indexOf("org.freedesktop.flatpak") === 0) {
                  return polkit.Result.YES;
              }
          });
          EOF
          fi
          if [ -d /etc/polkit-1/localauthority/50-local.d ]; then
            sudo tee /etc/polkit-1/localauthority/50-local.d/45-flatpak.pkla > /dev/null << 'EOF'
          [Allow all users to manage flatpak]
          Identity=unix-user:*
          Action=org.freedesktop.Flatpak.*;org.freedesktop.flatpak.*
          ResultAny=yes
          ResultInactive=yes
          ResultActive=yes
          EOF
          fi
      - run: echo "HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - run: source .bashrc && DEBUG=1 .local/bin/pimp-my-ride
